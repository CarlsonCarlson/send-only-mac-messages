[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "send-only-mac-messages"
version = "0.1.0"
description = "A send-only MCP adapter for macOS Messages with SMS fallback"
readme = {file = "README.md", content-type = "text/markdown"}
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Carlson Cheng"}
]
keywords = ["macos", "messages", "imessage", "sms", "mcp", "send-only"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: MacOS :: MacOS X",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "mcp[cli]>=1.2.0,<2.0.0",
]

[project.urls]
"Homepage" = "https://github.com/CarlsonCarlson/send-only-mac-messages"
"Bug Tracker" = "https://github.com/CarlsonCarlson/send-only-mac-messages/issues"
"Source" = "https://github.com/CarlsonCarlson/send-only-mac-messages"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "isort>=5.10.0",
    "mypy>=1.0.0",
]

[project.scripts]
send-only-mac-messages = "send_only_mac_messages.server:run_server"

[tool.setuptools]
packages = ["send_only_mac_messages"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]
